<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las tres partes de una página web</title>

  <!-- 3. ESTILO (CSS): decide cómo se ve el contenido -->
  <style>
    h1 {
      color: black; /* Cambia "black" por otro color en inglés: blue, red, green... */
    }
  </style>
</head>
<body>
  <!-- 2. ESTRUCTURA (HTML): las etiquetas dicen qué es cada cosa -->
  <!-- 1. CONTENIDO: el texto que está dentro de las etiquetas -->

  <!-- Cambia el texto del título por el nombre de algo que te guste -->
  <h1>Escribe aquí un título</h1>

  <!-- Cambia el texto del párrafo y cuenta en una frase por qué te gusta -->
  <p>Escribe aquí una frase.</p>
</body>
</html>
