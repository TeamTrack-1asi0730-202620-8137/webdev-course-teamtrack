<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Las tres partes de una página web</title>

  <!-- 3. ESTILO (CSS): decide cómo se ve el contenido -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4ff;
    }

    h1 {
      color: #2b4acb;
    }

    p {
      color: #333333;
    }
  </style>
</head>
<body>
  <!-- 2. ESTRUCTURA (HTML): las etiquetas dicen qué es cada cosa -->
  <!-- 1. CONTENIDO: el texto que está dentro de las etiquetas -->

  <h1>Mi canción favorita</h1>
  <p>Me gusta porque tiene mucho ritmo y la escucho cuando estudio.</p>
</body>
</html>
